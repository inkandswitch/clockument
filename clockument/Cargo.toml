[package]
name = "clockument"
version = "0.0.1"
description = "Utilities for creating, storing, and sharing multi-document transactions with Automerge CRDTs."

authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "../README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
automerge = "0.12.0"
autosurgeon = "0.14.0"
futures = "0.3.34"
indextree = "4.9.1"
rand = "0.10.3"
rstest = "0.27.0"
sedimentree_core = "0.14.2"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"

[dev-dependencies]
tokio-stream = { version = "0.1.18", features = ["sync"] }
tracing-subscriber = "0.3.23"
